<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="container-title">The <span style="color: darkorange">Odin</span> Project Calculator</h1>
        <div class="container-body">
             
            
            <div class="calculator">
                <div class="calculator-title">
                    <h1>Calculator</h1>
                </div>
                <div class="calculator-output-row">
                    <p class="calculator-output"></p>
                </div>
                <div class="calculator-results-row">
                    <p class="calculator-results"></p>
                </div>
                 
                
                <div class="calculator-middle">
                    <div class="top-row">
                        
                        <button>7</button>
                        <button>4</button>
                        <button>1</button>
                    </div>
                    <div class="middle-row">
                        <button>8</button>
                        <button>5</button>
                        <button>2</button>
                        <button>0</button>
                    </div>
                    <div class="bottom-row">
                        <button>9</button>
                        <button>6</button>
                        <button>3</button>
                        
                    </div>
                </div>

                <div class="calculator-bottom">
                    <button>+</button>
                    <button>-</button>
                    <button>x</button>
                    <button>/</button>
                    <button>=</button>
                </div>

                <div class="calculator-clear">
                    <button class="clear-btn">Clear</button>
                </div>
               
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
